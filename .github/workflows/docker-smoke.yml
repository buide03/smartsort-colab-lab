name: Docker deployment checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docker:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          bash -n deploy/oracle/deploy.sh
          bash -n deploy/oracle/backup.sh
          bash -n deploy/oracle/install-docker-ubuntu.sh
      - name: Build CPU server image
        run: docker build -t smartsort:ci .
      - name: Start with persistent volume and classroom password
        run: |
          docker network create smartsort-ci
          docker volume create smartsort_ci_data
          docker run -d --name smartsort-ci --network smartsort-ci --network-alias smartsort -p 18000:8000 -e SMARTSORT_CLASSROOM_PASSWORD=ci-password -v smartsort_ci_data:/data smartsort:ci
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:18000/healthz
      - name: Verify CPU inference dependencies
        run: >-
          docker exec smartsort-ci python -c
          "import torch; from smartsort_app.training import make_model; m=make_model(pretrained=False).eval(); y=m(torch.zeros(1,3,224,224)); assert y.shape==(1,3); assert not torch.cuda.is_available(); print('CPU inference OK')"
      - name: Verify classroom workflow
        run: python tests/container_smoke.py create
      - name: Verify Oracle Compose and HTTPS proxy
        run: |
          docker compose --env-file deploy/oracle/.env.example -f deploy/oracle/compose.yaml config --quiet
          docker run -d --name smartsort-proxy --network smartsort-ci -p 18443:443 -e SMARTSORT_DOMAIN=localhost -v "$PWD/deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2
          curl -k --fail --retry 30 --retry-delay 2 --retry-all-errors https://localhost:18443/healthz
          curl -k --fail -u class:ci-password https://localhost:18443/api/config
          test "$(curl -k -s -o /dev/null -w '%{http_code}' https://localhost:18443/api/sessions)" = 401
      - name: Restart container and verify persisted data
        run: |
          docker rm -f smartsort-ci
          docker run -d --name smartsort-ci --network smartsort-ci --network-alias smartsort -p 18000:8000 -e SMARTSORT_CLASSROOM_PASSWORD=ci-password -v smartsort_ci_data:/data smartsort:ci
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:18000/healthz
          python tests/container_smoke.py check
      - name: Container logs
        if: always()
        run: docker logs smartsort-ci || true
